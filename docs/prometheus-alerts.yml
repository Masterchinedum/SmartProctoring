# SmartProctoring — suggested Prometheus alerting rules (docs/OPERATIONS.md §5).
# Scrape GET /metrics with `Authorization: Bearer $METRICS_TOKEN`. Thresholds are starting points: tune them to your
# deployment once you have a few exam days of data. `sp_cluster_*` series are the same on every instance (max, not sum).
# `runbook_url` points at the runbook in docs/OPERATIONS.md (prefix it with your repository or wiki URL).
#   promtool check rules docs/prometheus-alerts.yml
# (apps/server/test/alert-rules.test.ts checks the structure, that every series exists and every runbook link resolves.)
groups:
  - name: smartproctoring-face-analysis
    rules:
      - alert: SmartProctoringNoFaceAnalysisWorker
        expr: sp_vision_workers == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.instance }}: no face-analysis worker"
          description: Identity checks and samples cannot be analysed on this instance; it also fails /api/health/ready.

      - alert: SmartProctoringVisionWorkerDown
        # Dedicated vision workers (VISION_DRIVER=remote) only; every server sees the same fleet: max, not sum.
        expr: max(sp_vision_remote_workers{state=~"down|unready"}) > 0
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "{{ $value }} dedicated vision worker(s) not answering or without a ready analysis thread"
          description: The other workers carry their frames (check capacity). Look at the worker's /health/ready, its log and VISION_WORKER_TOKEN (docs/OPERATIONS.md §7). With none left, SmartProctoringNoFaceAnalysisWorker fires.

      - alert: SmartProctoringVisionHopSlow
        expr: histogram_quantile(0.95, sum by (instance, le) (rate(sp_vision_remote_overhead_seconds_bucket[5m]))) > 0.1
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }}: the network hop to the vision workers adds more than 100 ms per frame (p95)"
          description: Usually a saturated network or an overloaded server event loop; a few ms is normal (p50 ≈ 2–5 ms on one host, docs/PERFORMANCE.md §8).

      - alert: SmartProctoringIdentitySamplesDelayed
        expr: max by (instance) (max_over_time(sp_vision_oldest_wait_seconds{priority="background"}[5m])) > 10
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }}: identity samples wait more than 10 s for face analysis"
          description: Swap detection slows down. Add an instance or CPU, stagger exam starts, or use the Balanced sampling intensity (docs/PERFORMANCE.md §6).

      - alert: SmartProctoringCheckInsSlow
        expr: histogram_quantile(0.95, sum by (instance, le) (rate(sp_vision_queue_wait_seconds_bucket{priority="interactive"}[5m]))) > 2
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }}: check-in / resume frames wait more than 2 s (p95) for face analysis"

      - alert: SmartProctoringFaceAnalysisRefusing
        expr: sum by (instance) (rate(sp_vision_refused_total[5m])) > 0.1
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.instance }}: face-analysis queue full, frames refused (503 vision_busy)"
          description: Candidates are told the server is busy and retry; check-ins and exam starts are delayed.

      - alert: SmartProctoringAtCapacity
        expr: avg_over_time(sp_capacity_accepting[15m]) < 0.5
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }}: at capacity most of the last 15 minutes (GET /api/health/capacity)"
          description: Add an instance or CPU before the next scheduled exam.

  - name: smartproctoring-candidates
    rules:
      - alert: SmartProctoringReportingOutage
        expr: |
          max(sp_cluster_sessions_reporting_interrupted) > 5
          and max(sp_cluster_sessions_reporting_interrupted) / clamp_min(max(sp_cluster_sessions{status="active"}), 1) > 0.2
        for: 3m
        labels: { severity: critical }
        annotations:
          summary: More than 20 % of active candidates have stopped reporting
          description: Usually a network, proxy or WebSocket / TLS problem in front of the servers rather than at the candidates.

      - alert: SmartProctoringIdentityMismatchRateHigh
        expr: |
          (
            sum(increase(sp_identity_decisions_total{decision="mismatch"}[1h]))
              / clamp_min(sum(increase(sp_identity_decisions_total[1h])), 1)
          ) > 3 * (
            sum(increase(sp_identity_decisions_total{decision="mismatch"}[1d]))
              / clamp_min(sum(increase(sp_identity_decisions_total[1d])), 1)
          )
          and sum(increase(sp_identity_decisions_total[1h])) > 200
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: Identity mismatches are three times more frequent than over the last day
          description: Check for a new browser or camera driver, a deploy that changed sp_identity_model_info, or a calibration problem before trusting the holds.

      - alert: SmartProctoringUnableToVerifyRateHigh
        expr: |
          sum(increase(sp_identity_decisions_total{kind="check",decision="unable_to_verify"}[1h]))
            / clamp_min(sum(increase(sp_identity_decisions_total{kind="check"}[1h])), 1) > 0.15
          and sum(increase(sp_identity_decisions_total{kind="check"}[1h])) > 50
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: More than 15 % of identity checks end as "unable to verify"
          description: Candidates' images are too poor to compare (lighting, cameras). They get guidance and retries, then human review; staff workload rises.

      - alert: SmartProctoringCheckInsHeldOften
        expr: |
          sum(increase(sp_checks_completed_total{purpose="initial",outcome="held"}[1h]))
            / clamp_min(sum(increase(sp_checks_completed_total{purpose="initial"}[1h])), 1) > 0.1
          and sum(increase(sp_checks_completed_total{purpose="initial"}[1h])) > 50
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: More than 10 % of check-ins end on hold (candidates cannot start until staff decide)
          description: Usually lighting or cameras ("unable to verify" after every attempt) or a change in the check (sp_identity_model_info); occasionally a different person. Staff workload rises.
          runbook_url: docs/OPERATIONS.md#runbook-check-ins-held

  - name: smartproctoring-data
    rules:
      - alert: SmartProctoringRetentionNotRunning
        # job_status in Postgres: the last success on any instance, kept across restarts and deploys.
        expr: (time() - max(sp_cluster_job_last_success_timestamp_seconds{job="retention"}) > 3 * 3600) or absent(sp_cluster_job_last_success_timestamp_seconds{job="retention"})
        for: 2h
        labels: { severity: critical }
        annotations:
          summary: Evidence retention has not completed for more than 3 hours
          description: Evidence may be kept longer than the privacy notice says (docs/PRIVACY.md §4). Check the "background job failed" log lines; with no error at all, no instance runs background jobs (SWEEPER_ENABLED).
          runbook_url: docs/OPERATIONS.md#runbook-retention-failing

      - alert: SmartProctoringRetentionLastRunFailed
        expr: max(sp_cluster_job_last_run_failed{job="retention"}) == 1
        for: 90m
        labels: { severity: warning }
        annotations:
          summary: The last evidence-retention runs failed as a whole (the next run is within the hour)
          runbook_url: docs/OPERATIONS.md#runbook-retention-failing

      - alert: SmartProctoringEvidencePastDeletionDate
        expr: max(sp_cluster_retention_overdue_oldest_seconds) > 2 * 3600
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "Session images are still stored {{ $value | humanizeDuration }} after their deletion date"
          description: Retention is behind or failing (Privacy → Deletion schedule lists them). Sessions under legal hold are not counted.
          runbook_url: docs/OPERATIONS.md#runbook-retention-failing

      - alert: SmartProctoringEvidencePastDeletionDateDay
        expr: max(sp_cluster_retention_overdue_oldest_seconds) > 24 * 3600
        for: 30m
        labels: { severity: critical }
        annotations:
          summary: Images have been kept more than a day past their deletion date (the privacy notice is not being met)
          runbook_url: docs/OPERATIONS.md#runbook-retention-failing

      - alert: SmartProctoringPrivacyRequestsOverdue
        expr: max(sp_cluster_privacy_requests_overdue) > 0
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "{{ $value }} data-subject request(s) in the privacy register are past their response deadline"
          description: The legal deadline (one month, or as extended) has passed. Privacy → requests, sorted by deadline.
          runbook_url: docs/OPERATIONS.md#runbook-privacy-requests-overdue

      - alert: SmartProctoringRetentionFailures
        expr: sum(increase(sp_retention_failures_total[2h])) > 0
        for: 0m
        labels: { severity: warning }
        annotations:
          summary: Retention could not purge some sessions (retried every hour)

      - alert: SmartProctoringEvidenceStorageErrors
        expr: sum by (location) (increase(sp_evidence_storage_errors_total[10m])) > 0
        for: 0m
        labels: { severity: critical }
        annotations:
          summary: 'The evidence store is failing (storage location {{ $labels.location }}: disk or S3)'
          description: Screenshots and identity images of the organisations using this storage location cannot be stored or read; check disk space, the volume or the bucket's credentials (STORAGE_* for "default", STORAGE_LOCATION_<NAME>_* for the others).

      - alert: SmartProctoringEvidenceStorageSlow
        expr: histogram_quantile(0.95, sum by (instance, location, le) (rate(sp_evidence_storage_seconds_bucket{op="put"}[5m]))) > 2
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }}: storing an image in storage location {{ $labels.location }} takes more than 2 s (p95)"
          description: Check frames and identity samples hold their database transaction while the image is written; a slow disk or S3 endpoint slows check-ins and exhausts the Postgres pool.
          runbook_url: docs/OPERATIONS.md#runbook-evidence-storage-slow

      - alert: SmartProctoringBackgroundJobFailing
        expr: sum by (job) (increase(sp_job_runs_total{result="failed"}[30m])) > 0
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "Background job {{ $labels.job }} keeps failing"

  - name: smartproctoring-integrations
    rules:
      - alert: SmartProctoringWebhookBacklog
        expr: max(sp_cluster_webhook_oldest_pending_seconds) > 900
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: A webhook delivery has been pending for more than 15 minutes
          description: The receiver is failing or slow (Integrations → Webhooks → Deliveries shows the last error).

      - alert: SmartProctoringWebhookDeadLetters
        expr: max(sp_cluster_webhook_deliveries_failed_24h) > 0
        for: 0m
        labels: { severity: info }
        annotations:
          summary: Webhook deliveries gave up after every retry in the last 24 h

      - alert: SmartProctoringEmailAlertBacklog
        expr: max(sp_cluster_email_alert_oldest_pending_seconds) > 1800
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: Staff alert emails have been waiting for more than 30 minutes (SMTP problem?)

      - alert: SmartProctoringApiKeysExpiringSoon
        expr: max(sp_cluster_api_keys_expiring_soon) > 0
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "{{ $value }} integration API key(s) expire within 14 days"
          description: Integrations → API keys shows which ("Expires in N days"). Create a replacement with the same access, have it deployed, then revoke the old key (docs/OPERATIONS.md §7, "Rotating an API key").

  - name: smartproctoring-review
    rules:
      - alert: SmartProctoringHoldsOverdue
        expr: max(sp_cluster_review_holds_overdue) > 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "{{ $value }} exam(s) on hold longer than the review target — candidates are waiting for a staff decision"

      - alert: SmartProctoringReviewBacklogOld
        expr: max(sp_cluster_review_oldest_undecided_flag_seconds) > 7 * 24 * 3600
        for: 1h
        labels: { severity: info }
        annotations:
          summary: A flag has been waiting for a reviewer decision for more than a week (review queue backlog)

  - name: smartproctoring-service
    rules:
      - alert: SmartProctoringServerErrors
        expr: |
          sum(rate(sp_http_requests_total{status=~"5..", status!="503"}[5m]))
            / clamp_min(sum(rate(sp_http_requests_total[5m])), 1) > 0.02
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: More than 2 % of requests fail with a server error (503 vision_busy excluded)

      - alert: SmartProctoringDatabasePoolExhausted
        expr: max by (instance) (sp_db_pool_connections{state="waiting"}) > 5
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }}: requests are waiting for a Postgres connection"
          runbook_url: docs/OPERATIONS.md#runbook-database-pool

      - alert: SmartProctoringDatabasePoolSlow
        expr: histogram_quantile(0.95, sum by (instance, le) (rate(sp_db_pool_acquire_seconds_bucket[5m]))) > 0.1
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }}: requests wait more than 100 ms (p95) for a Postgres connection"
          description: The pool is saturated before requests start to queue visibly (PG_POOL_MAX, slow queries, long transactions).
          runbook_url: docs/OPERATIONS.md#runbook-database-pool

      - alert: SmartProctoringDatabaseUnreachable
        expr: sum by (instance) (rate(sp_db_connection_errors_total{kind="connect"}[5m])) > 0.05
        for: 3m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.instance }}: cannot open connections to Postgres"
          description: Requests fail with 500 and /api/health/ready answers 503 (db error). Candidates' browsers keep answers, events and images and resend them once it is back.
          runbook_url: docs/OPERATIONS.md#runbook-database-unreachable

      - alert: SmartProctoringDatabaseConnectionsDropped
        expr: sum by (instance) (increase(sp_db_connection_errors_total{kind="lost"}[15m])) > 10
        for: 0m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }}: Postgres keeps closing open connections"
          description: Expected once per connection at a Postgres restart or failover; repeated drops point to a proxy / PgBouncer, a network problem or idle_in_transaction_session_timeout.
          runbook_url: docs/OPERATIONS.md#runbook-database-unreachable

      - alert: SmartProctoringClusterMetricsDown
        expr: max(sp_cluster_metrics_up) == 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: The sp_cluster_* metrics cannot be read from Postgres
