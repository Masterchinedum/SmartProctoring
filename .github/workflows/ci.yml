name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Public face photos (fetched at pinned commits with SHA-256 checks, never committed): the real-model tests and the
  # camera scenarios read them. With the REQUIRE / NO_SKIP switches a missing image fails the run instead of skipping
  # tests, so green means every scenario ran.
  FACES_DIR: /tmp/sp-faces
  FACESETS_DIR: /tmp/sp-facesets

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGUSER: postgres
      SP_TEST_FACES_DIR: /tmp/sp-faces
      SP_TEST_FACESETS_DIR: /tmp/sp-facesets
      SP_REQUIRE_TEST_IMAGES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: |
            /tmp/sp-faces
            /tmp/sp-facesets
          key: face-images-${{ hashFiles('e2e/scripts/fetch-faces.ts', 'apps/server/src/eval/datasets.ts') }}
      - run: E2E_FACES_DIR=$FACES_DIR pnpm --filter @sp/e2e fetch-faces
      - run: pnpm --filter @sp/server eval:fetch-faces -- --dir $FACESETS_DIR
      - run: psql -c 'create database proctor_test' && psql -c 'create database proctor'
      - run: pnpm typecheck
      - run: pnpm --filter @sp/e2e typecheck
      - run: pnpm test
      - run: pnpm --filter @sp/web build && pnpm --filter @sp/server build

  e2e:
    # The core end-to-end scenarios (tests 01–18: real server, real models, Chromium with a fake camera). The
    # webcam-realistic accuracy scenarios (20–24) run nightly (nightly.yml).
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      E2E_FACES_DIR: /tmp/sp-faces
      E2E_NO_SKIP: "1"
      E2E_SKIP_REALISTIC: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: |
            /tmp/sp-faces
            /tmp/sp-facesets
          key: face-images-${{ hashFiles('e2e/scripts/fetch-faces.ts', 'apps/server/src/eval/datasets.ts') }}
      - run: pnpm --filter @sp/e2e fetch-faces
      - run: pnpm --filter @sp/e2e exec playwright install --with-deps chromium
      - run: pnpm --filter @sp/e2e exec playwright test 'tests/[01]'
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-core-artifacts
          path: |
            e2e/.artifacts
            e2e/test-results
            e2e/playwright-report
          retention-days: 7

  e2e-browsers:
    # The scenarios tagged @cross-browser in Firefox and WebKit (e2e/README.md "Browsers"). Their candidate camera is
    # the canvas shim of e2e/lib/camera.ts playing the same fixtures (Chromium's fake capture device has no
    # equivalent there). Same command on a developer machine: E2E_BROWSERS=webkit pnpm --filter @sp/e2e exec playwright test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      E2E_FACES_DIR: /tmp/sp-faces
      E2E_NO_SKIP: "1"
      E2E_SKIP_REALISTIC: "1"
      E2E_BROWSERS: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: |
            /tmp/sp-faces
            /tmp/sp-facesets
          key: face-images-${{ hashFiles('e2e/scripts/fetch-faces.ts', 'apps/server/src/eval/datasets.ts') }}
      - run: pnpm --filter @sp/e2e fetch-faces
      - run: pnpm --filter @sp/e2e exec playwright install --with-deps ${{ matrix.browser }}
      - run: pnpm --filter @sp/e2e exec playwright test --project=${{ matrix.browser }}
      - if: failure()
        name: Print the browser-side diagnostics of failed tests
        # Candidate logs (identity API answers, console errors, HTTP errors, camera shim statistics) and page snapshots,
        # readable in the job log without downloading the artifacts.
        run: |
          find e2e/test-results \( -name 'candidate-*.log' -o -name 'error-context.md' \) -not -path '*/attachments/*' | sort | while read -r f; do
            echo "::group::$f"; head -c 12000 "$f"; echo; echo "::endgroup::"
          done
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.browser }}-artifacts
          path: |
            e2e/.artifacts
            e2e/test-results
            e2e/playwright-report
          retention-days: 7

  docker:
    # Builds the production image and boots it: migrations, the vision workers on Node 24, the web app, health probes.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t smartproctoring:ci .
      - name: Boot the image and probe it
        run: |
          docker run -d --name sp --network host \
            -e PORT=8080 -e DATABASE_URL=postgres://postgres@127.0.0.1:5432/postgres \
            -e EVIDENCE_KEY="$(openssl rand -base64 32)" -e SESSION_SECRET="$(openssl rand -base64 48)" \
            -e PUBLIC_URL=http://localhost:8080 -e COOKIE_SECURE=false \
            -e BOOTSTRAP_ADMIN_EMAIL=owner@example.com -e BOOTSTRAP_ADMIN_PASSWORD="$(openssl rand -hex 16)" \
            smartproctoring:ci
          for i in $(seq 1 60); do curl -sf http://localhost:8080/api/health/ready && break; sleep 2; done
          curl -sf http://localhost:8080/api/health/ready
          curl -sf http://localhost:8080/api/health/live
          curl -sf http://localhost:8080/api/health/capacity | grep -q '"accepting":true'
          curl -sf -o /dev/null http://localhost:8080/admin
          test "$(docker exec sp node -p 'process.versions.node.split(".")[0]')" = 24
      - name: Boot a dedicated vision worker and a server using it (VISION_DRIVER=remote), and probe them
        run: |
          TOKEN="$(openssl rand -hex 32)"
          docker run -d --name spv --network host -e VISION_WORKER_PORT=8090 -e VISION_WORKER_TOKEN="$TOKEN" \
            smartproctoring:ci node dist/vision-server.js
          for i in $(seq 1 60); do curl -sf http://localhost:8090/health/ready && break; sleep 2; done
          curl -sf http://localhost:8090/health/ready
          curl -sf http://localhost:8090/health/live
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8090/v1/load)" = 401
          curl -sf -H "Authorization: Bearer $TOKEN" http://localhost:8090/v1/load | grep -q '"workers":[1-9]'
          # One real analysis on the worker (decode + YuNet on a generated face-less JPEG), from inside its container.
          docker exec -e TOKEN="$TOKEN" spv node -e "require('sharp')({create:{width:320,height:240,channels:3,background:'#777'}}).jpeg().toBuffer().then(b=>fetch('http://127.0.0.1:8090/v1/analyze',{method:'POST',headers:{authorization:'Bearer '+process.env.TOKEN,'content-type':'image/jpeg','x-vision-options':'{\"embed\":true}'},body:b})).then(async r=>{const j=await r.json();console.log(r.status,JSON.stringify(j.analysis.quality));process.exit(r.status===200&&j.analysis.quality.faceCount===0?0:1)}).catch(e=>{console.error(e);process.exit(1)})"
          docker run -d --name spr --network host \
            -e PORT=8081 -e DATABASE_URL=postgres://postgres@127.0.0.1:5432/postgres \
            -e EVIDENCE_KEY="$(openssl rand -base64 32)" -e SESSION_SECRET="$(openssl rand -base64 48)" \
            -e PUBLIC_URL=http://localhost:8081 -e COOKIE_SECURE=false \
            -e VISION_DRIVER=remote -e VISION_WORKER_URLS=http://127.0.0.1:8090 -e VISION_WORKER_TOKEN="$TOKEN" \
            smartproctoring:ci
          for i in $(seq 1 60); do curl -sf http://localhost:8081/api/health/ready && break; sleep 2; done
          curl -sf http://localhost:8081/api/health/ready | grep -q '"visionWorkers":{"ready":1,"configured":1}'
          curl -sf http://localhost:8081/api/health/capacity | grep -q '"accepting":true'
          # The image's HEALTHCHECK probes the worker in the worker container.
          for i in $(seq 1 30); do test "$(docker inspect -f '{{.State.Health.Status}}' spv)" = healthy && break; sleep 2; done
          test "$(docker inspect -f '{{.State.Health.Status}}' spv)" = healthy
          # A dead worker: the server stays up but is no longer ready (vision unavailable) and stops taking exam starts.
          docker stop spv
          for i in $(seq 1 15); do test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8081/api/health/ready)" = 503 && break; sleep 1; done
          curl -s http://localhost:8081/api/health/ready | grep -q '"vision":"unavailable"'
          curl -s http://localhost:8081/api/health/capacity | grep -q 'vision_unavailable'
          curl -sf http://localhost:8081/api/health/live
      - if: always()
        run: |
          docker logs sp || true
          docker logs spv || true
          docker logs spr || true
